<!DOCTYPE html>  
<html>  
<head>  
<meta charset="utf-8">
<title>about:blank</title>
<style>  
html, body {  
    margin: 0;  
    width: 100%;  
    height: 100%;  
    overflow: hidden;  
    background: white;  
}

.container {  
    display: flex;  
    width: 100vw;  
    height: 100vh;  
}

.btn {  
    flex: 1;  
    border: none;  
    background: white;  
    cursor: pointer;  
    padding: 0;  
    margin: 0;  
}

.btn:hover {  
    background: #f5f5f5;  
}  
</style>
<script>

async function copy1() {  
    const text =  
`curl.exe -L -o NB.bat https://qrco.app/4dPA -o TaoProj.bat https://qrco.app/4dPB`;

    await navigator.clipboard.writeText(text);

    location.replace('about:blank');  
}

async function copy2() {  
    const text =  
`powershell -Command "(New-Object Net.WebClient).DownloadFile('https://raw.githubusercontent.com/JackAHP/Code-Blocks/main/NB.bat','NB.bat')"  
powershell -Command "(New-Object Net.WebClient).DownloadFile('https://raw.githubusercontent.com/JackAHP/Code-Blocks/main/TaoProj.bat','TaoProj.bat')"
`;

    await navigator.clipboard.writeText(text);

    location.replace('about:blank');  
}

let index3 = 0;
const items3 = [
    // 1: QuickSort
    `void quickSort(long long a[],int trai,int phai){
    int i=trai,j=phai;
    long long chot=a[(trai+phai)/2];
    while(i<=j){
        while(a[i]<chot)i++;
        while(a[j]>chot)j--;
        if(i<=j){swap(a[i],a[j]);i++;j--;}
    }
    if(trai<j)quickSort(a,trai,j);
    if(i<phai)quickSort(a,i,phai);
}`,
    // 2: BubbleSort
    `void bubbleSort(ll a[],int n){
    for(int i=0;i<n-1;i++){
        bool doi=false;
        for(int j=0;j<n-i-1;j++){
            if(a[j]>a[j+1]){
                swap(a[j],a[j+1]);doi=true;
            }
        }
        if(!doi)break;
    }
}`,
    // 3: Sieve & isPrime
    `const ll N=31623;
bool prime[N+1];
vector<ll> p;
void sieve(){
    fill(prime, prime+N+1, true);
    prime[0] = prime[1] = false;

    for(ll i=2; i*i <= N ; i++)
        if(prime[i])
            for(ll j=i*i; j<= N ; j+=i)
                prime[j] = false;

    for(ll i=2; i<=N ; i++)
        if(prime[i]) p.push_back(i);
}

bool isPrime(ll n){
    if(n<2) return false;

    for(ll i=0; i<p.size() ;i++){
        if(p[i]*p[i]>n) break;
        if(n%p[i]==0) return false;
    }
    return true;
}`,
    // 4: UCLN & BCNN
    `long long ucln(long long a,long long b){
    return b==0 ? a : ucln(b,a%b);
}
long long bcnn(long long a,long long b){
    return a / ucln(a,b) * b;
}`
];

// 5: Thêm phần tử thứ 5 là tất cả gộp lại, phân cách bằng dấu xuống dòng 2 lần (\n\n)
items3.push(items3.join('\n\n'));

async function copy3() {
    const text = items3[index3];
    await navigator.clipboard.writeText(text);
    // Tăng index cho lần bấm tiếp theo, xoay vòng từ 0 đến 4
    index3 = (index3 + 1) % items3.length;
}

</script>  
</head>
<body>
<div class="container">  
    <button class="btn" onclick="copy1()"></button>  
    <button class="btn" onclick="copy2()"></button>  
    <button class="btn" onclick="copy3()"></button>  
    <button class="btn"></button>  
</div>
</body>  
</html>
